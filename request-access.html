<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secured Enclave // Access Terminal</title>

    <!-- CSS Architecture -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <!-- FontAwesome Icons for HUD Graphics -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            display: flex;
            flex-direction: column; /* Stack main wrapper and footer */
            min-height: 100vh;
            background: radial-gradient(circle at center, rgba(0, 243, 255, 0.05) 0%, var(--bg-base) 80%);
            margin: 0;
            padding: 0;
        }

        .main-wrapper {
            flex: 1; /* Pushes the footer to the bottom */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--space-xl) var(--space-md);
            width: 100%;
        }

        .enclave-container {
            width: 100%;
            max-width: 460px;
            background: var(--bg-glass-heavy);
            backdrop-filter: var(--blur-heavy);
            -webkit-backdrop-filter: var(--blur-heavy);
            border: var(--border-glass-strong);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), var(--shadow-glow-cyan);
            position: relative;
            z-index: 10;
        }

        .enclave-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: var(--space-lg);
        }

        .enclave-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-size: 0.85rem;
            padding: var(--space-sm) 0;
            cursor: pointer;
            transition: var(--transition-fast);
            text-align: center;
            text-transform: uppercase;
            position: relative;
            letter-spacing: 0.05em;
        }

        .enclave-tab.active {
            color: var(--accent-cyan);
        }

        .enclave-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: var(--shadow-glow-cyan);
        }

        .form-group {
            margin-bottom: var(--space-md);
        }

        .form-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-xs);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input, .form-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-sm);
            padding: 0.75rem var(--space-md);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition-fast);
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent-cyan);
            box-shadow: var(--shadow-glow-cyan);
        }

        .form-select option {
            background: var(--bg-base);
            color: var(--text-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeInUp 0.4s ease forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Main Viewport Wrapper -->

                    <!-- Neural Scanner Animation -->
                    <div class="hud-scanner-line" style="position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--accent-cyan); box-shadow: 0 0 20px 8px rgba(0, 243, 255, 0.6); animation: neuralScan 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1); z-index: 10;"></div>
                    
                    <!-- QR Payload (Direct Cloud Fetch) -->
                    <img src="https://drive.google.com/uc?export=view&id=1XCYQFAtFgphHHB2AnEuyMn5LT2ZgL8Lp" alt="Encrypted QR Code" style="position: relative; z-index: 5; width: 85%; height: 85%; object-fit: contain; opacity: 0.95; filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.4));">
                </div>

                    sajalbaruah0614@upi
                </div>

                    <span class="badge badge-system" style="font-size: 0.75rem; letter-spacing: 0.1em; background: rgba(0,0,0,0.4); padding: 0.4rem 0.8rem; border: 1px solid rgba(0, 243, 255, 0.4); color: var(--accent-cyan); border-radius: var(--radius-xs); display: inline-flex; align-items: center;">
                        <i class="fas fa-lock" style="margin-right: 6px;"></i> 256-BIT ENCRYPTED CHANNEL
                    </span>
                </div>
            </div>

            <!-- Footer Link Back -->
            <div style="text-align: center; margin-top: var(--space-xl);">
                <a href="index.html" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); text-decoration: none; transition: 0.2s;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-muted)'">
                    &larr; Return to Main Website
                </a>
            </div>

        </div>
    </div>

    <!-- UNIVERSAL TELEMETRY & COMMS FOOTER -->

        <div class="container footer-grid" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-xl); max-width: var(--container-max-width); margin: 0 auto; padding: 0 var(--space-lg);">

                <p style="color: var(--text-secondary); font-family: var(--font-rajdhani); font-size: 1.1rem; letter-spacing: 0.05em; margin: 0 0 8px 0;">

            <!-- Right Side: Comms Array (Pill Buttons) -->
            <div class="footer-contact-pills" style="display: flex; gap: var(--space-md); flex-wrap: wrap;">
                <a href="tel:+919678092519" class="pill-btn pill-blue" style="display: inline-flex; align-items: center; gap: 10px; padding: 0.6rem 1.4rem; border-radius: 50px; font-family: var(--font-rajdhani); font-weight: 700; font-size: 0.95rem; text-transform: uppercase; text-decoration: none; letter-spacing: 0.05em; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(59, 130, 246, 0.3); background: rgba(59, 130, 246, 0.1); color: #60a5fa;" onmouseover="this.style.background='rgba(59, 130, 246, 0.25)'; this.style.borderColor='#60a5fa'; this.style.color='#ffffff'; this.style.boxShadow='0 0 20px rgba(59, 130, 246, 0.6)'; this.style.transform='translateY(-2px)';" onmouseout="this.style.background='rgba(59, 130, 246, 0.1)'; this.style.borderColor='rgba(59, 130, 246, 0.3)'; this.style.color='#60a5fa'; this.style.boxShadow='none'; this.style.transform='translateY(0)';">

        </div>

    <!-- Core Scripts -->
    <script src="assets/js/core.js"></script>
    <script src="assets/js/animations.js"></script>

    <!-- Firebase Auth ES Module MUST load before the inline script -->
    <script type="module" src="assets/js/auth.js"></script>

    <!-- Tab Switching, Login Logic & Clock Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Tab Switching Logic
            const tabs = document.querySelectorAll('.enclave-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const targetId = tab.getAttribute('data-target');

                    // Update active tab styles
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    // Update active panes
                    document.querySelectorAll('.tab-content').forEach(pane => {
                        pane.classList.remove('active');
                    });
                    document.getElementById(targetId).classList.add('active');
                });
            });

            // Handle Login Form Submission
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault(); // Prevent page reload

                    const portal = document.getElementById('portal-select').value;
                    const passcode = document.getElementById('passcode-input').value;
                    const btn = document.getElementById('unlock-btn');
                    const originalBtnText = btn.innerHTML;

                    // Ensure the Firebase module has successfully loaded
                    if (window.AuthSystem) {
                        // Change button to show loading state
                        btn.innerHTML = 'Verifying... <i class="fas fa-spinner fa-spin" style="margin-left: 8px;"></i>';
                        btn.disabled = true;

                        // Attempt to authenticate
                        const success = await window.AuthSystem.authenticate(portal, passcode);

                        // If it fails, reset the button so the user can try again
                        if (!success) {
                            btn.innerHTML = originalBtnText;
                            btn.disabled = false;
                        }
                    } else {
                        console.error('[SECURITY] AuthSystem module not loaded.');
                        if (window.AppCore) {
                            window.AppCore.notify('System is initializing. Please wait a moment and try again.', 'warning');
                        } else {
                            alert("Security module is still loading. Please try again in a moment.");
                        }
                    }
                });
            }

            // Initialize IST Telemetry Clock
            const clockDisplay = document.getElementById('system-ist-clock');
            if (clockDisplay) {
                function updateTick() {
                    const now = new Date();
                    const timeOptions = { 
                        timeZone: 'Asia/Kolkata', 
                        hour: '2-digit', 
                        minute: '2-digit', 
                        second: '2-digit', 
                        hour12: true 
                    };
                    const formattedTime = new Intl.DateTimeFormat('en-IN', timeOptions).format(now);
                    clockDisplay.textContent = formattedTime;
                }
                updateTick();
                setInterval(updateTick, 1000);
            }
        });
    </script>
</body>
