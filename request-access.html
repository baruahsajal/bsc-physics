<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access | Educational Portal</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-xl) var(--space-md);
            background: radial-gradient(circle at top right, rgba(0, 243, 255, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(189, 0, 255, 0.05), transparent 40%);
        }
        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: var(--space-xl);
            border-top: 3px solid var(--accent-cyan);
        }
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: var(--space-lg);
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: var(--space-sm);
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: var(--transition-fast);
        }
        .auth-tab.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
        }
        .tab-content { display: none; animation: fadeInUp 0.3s ease; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: var(--space-md); }
        .form-label {
            display: block;
            margin-bottom: var(--space-xs);
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-control {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
            padding: 0.875rem 1rem;
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            transition: var(--transition-fast);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 243, 255, 0.1);
        }
        #auth-alert {
            display: none;
            padding: var(--space-sm);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-danger);
            border-radius: var(--radius-sm);
            margin-bottom: var(--space-md);
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="glass-panel auth-card animate-fade-up">
            <div style="text-align: center; margin-bottom: var(--space-lg);">
                <i class="fas fa-shield-alt pulse-slow" style="font-size: 2.5rem; color: var(--accent-cyan); margin-bottom: var(--space-md);"></i>
                <h1 class="heading-display" style="font-size: 1.5rem; margin-bottom: var(--space-xs);">Secured Enclave</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">Authentication required to access educational resources.</p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" data-target="login">Authenticate</div>
                <div class="auth-tab" data-target="request">Request Access</div>
            </div>

            <div id="auth-alert"></div>

            <div id="login" class="tab-content active">
                <div class="form-group">
                    <label class="form-label">Select Destination</label>
                    <select id="login-portal" class="form-control">
                        <option value="bsc">B.Sc. Physics Ecosystem</option>
                        <option value="class9">Class 9 Science Academy</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Security Passcode</label>
                    <input type="password" id="login-password" class="form-control" placeholder="Enter your assigned passcode">
                </div>
                <button id="btn-login" class="btn btn-primary" style="width: 100%; margin-top: var(--space-sm);">
                    Unlock Portal <i class="fas fa-unlock"></i>
                </button>
                <div style="text-align: center; margin-top: var(--space-md);">
                    <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;"><i class="fas fa-arrow-left"></i> Return to Main Website</a>
                </div>
            </div>

            <div id="request" class="tab-content">
                <form action="https://api.web3forms.com/submit" method="POST" id="access-form">
                    <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY_HERE">
                    <input type="hidden" name="subject" value="New Portal Access Request">
                    
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Institution / School</label>
                        <input type="text" name="institution" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Target Module</label>
                        <select name="module" class="form-control" required>
                            <option value="B.Sc. Physics FYUGP">B.Sc. Physics FYUGP</option>
                            <option value="Class 9 Science">Class 9 Science</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Purpose of Access</label>
                        <textarea name="purpose" class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-outline" style="width: 100%; margin-top: var(--space-sm);">
                        Submit Application <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                e.target.classList.add('active');
                document.getElementById(e.target.getAttribute('data-target')).classList.add('active');
                document.getElementById('auth-alert').style.display = 'none';
            });
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            const portal = document.getElementById('login-portal').value;
            const pass = document.getElementById('login-password').value;
            const alertBox = document.getElementById('auth-alert');

            if (!pass) {
                alertBox.textContent = 'Passcode is required.';
                alertBox.style.display = 'block';
                return;
            }

            const success = await AuthSystem.authenticate(portal, pass);
            if (!success) {
                alertBox.textContent = 'Invalid credentials. Please request access if you do not have a passcode.';
                alertBox.style.display = 'block';
                document.getElementById('login-password').value = '';
            }
        });

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const target = params.get('target');
            const reason = params.get('reason');
            
            if (target && document.getElementById('login-portal')) {
                document.getElementById('login-portal').value = target;
            }
            if (reason === 'unauthorized') {
                const alertBox = document.getElementById('auth-alert');
                alertBox.textContent = 'Active session required. Please authenticate.';
                alertBox.style.display = 'block';
            }
        };
    </script>
</body>
</html>
