<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secured Enclave // Access Terminal</title>

    <!-- CSS Architecture -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <!-- FontAwesome Icons for HUD Graphics -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, rgba(0, 243, 255, 0.05) 0%, var(--bg-base) 80%);
            overflow: hidden;
            padding: var(--space-md);
        }

        .enclave-container {
            width: 100%;
            max-width: 460px;
            background: var(--bg-glass-heavy);
            backdrop-filter: var(--blur-heavy);
            -webkit-backdrop-filter: var(--blur-heavy);
            border: var(--border-glass-strong);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), var(--shadow-glow-cyan);
            position: relative;
            z-index: 10;
        }

        .enclave-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: var(--space-lg);
        }

        .enclave-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-size: 0.9rem;
            padding: var(--space-sm) 0;
            cursor: pointer;
            transition: var(--transition-fast);
            text-align: center;
            text-transform: uppercase;
            position: relative;
        }

        .enclave-tab.active {
            color: var(--accent-cyan);
        }

        .enclave-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: var(--shadow-glow-cyan);
        }

        .form-group {
            margin-bottom: var(--space-md);
        }

        .form-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-xs);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input, .form-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-sm);
            padding: 0.75rem var(--space-md);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition-fast);
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent-cyan);
            box-shadow: var(--shadow-glow-cyan);
        }

        .form-select option {
            background: var(--bg-base);
            color: var(--text-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="enclave-container animate-fade-up">

        <!-- Header Branding -->
        <div style="text-align: center; margin-bottom: var(--space-lg);">
            <i class="fas fa-shield-alt pulse-slow" style="font-size: 2.5rem; color: var(--accent-cyan); margin-bottom: var(--space-xs);"></i>
            <h1 class="heading-display" style="font-size: 1.5rem; letter-spacing: 0.1em; color: var(--text-primary);">SECURED ENCLAVE</h1>
            <p style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px;">Authentication required to access educational resources.</p>
        </div>

        <!-- Terminal Tabs -->
        <div class="enclave-tabs">
            <button class="enclave-tab active" data-target="auth-pane">Authenticate</button>
            <button class="enclave-tab" data-target="request-pane">Request Access</button>
        </div>

        <!-- TAB 1: AUTHENTICATION PANEL -->
        <div id="auth-pane" class="tab-content active">
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="portal-select">Select Destination</label>
                    <select id="portal-select" class="form-select">
                        <option value="class9">Class 9 Science Academy</option>
                        <option value="bsc">B.Sc. Physics Ecosystem</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: var(--space-xl);">
                    <label class="form-label" for="passcode-input">Security Passcode</label>
                    <input type="password" id="passcode-input" class="form-input" placeholder="Enter your assigned passcode" required>
                </div>

                <button type="submit" id="unlock-btn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; justify-content: center; font-size: 0.95rem;">
                    Unlock Portal <i class="fas fa-lock-open" style="margin-left: 8px;"></i>
                </button>
            </form>
        </div>

        <!-- TAB 2: REQUEST ACCESS PANEL -->
        <div id="request-pane" class="tab-content">
            <form action="https://api.web3forms.com/submit" method="POST">
                <!-- Web3Forms Access Key (FIXED) -->
                <input type="hidden" name="access_key" value="15f13211-3a69-4812-9a92-0d4bff3669d1">
                <input type="hidden" name="subject" value="New Portal Access Request">
                <input type="hidden" name="redirect" value="https://api.web3forms.com/success">

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-input" placeholder="e.g., Rahul Sharma" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-input" placeholder="student@domain.edu" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Institution / School</label>
                    <input type="text" name="institution" class="form-input" placeholder="e.g., Biswanath College" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Target Module</label>
                    <select name="target_module" class="form-select">
                        <option value="Class 9 Science">Class 9 Science Academy</option>
                        <option value="B.Sc Physics">B.Sc Physics Portal</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: var(--space-xl);">
                    <label class="form-label">Purpose of Access</label>
                    <textarea name="message" class="form-input" rows="2" placeholder="Briefly state your requirement..." style="resize: none;" required></textarea>
                </div>

                <button type="submit" class="btn btn-outline" style="width: 100%; padding: 0.75rem; justify-content: center; font-size: 0.95rem; border-color: var(--accent-cyan); color: var(--accent-cyan);">
                    Submit Application <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>
                </button>
            </form>
        </div>

        <!-- Footer Link Back -->
        <div style="text-align: center; margin-top: var(--space-lg);">
            <a href="index.html" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); text-decoration: none; transition: 0.2s;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-muted)'">
                &larr; Return to Main Website
            </a>
        </div>

    </div>

    <!-- Core Scripts -->
    <script src="assets/js/core.js"></script>
    <script src="assets/js/animations.js"></script>

    <!-- Firebase Auth ES Module MUST load before the inline script -->
    <script type="module" src="assets/js/auth.js"></script>

    <!-- Tab Switching & Login Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Tab Switching Logic
            const tabs = document.querySelectorAll('.enclave-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const targetId = tab.getAttribute('data-target');

                    // Update active tab styles
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    // Update active panes
                    document.querySelectorAll('.tab-content').forEach(pane => {
                        pane.classList.remove('active');
                    });
                    document.getElementById(targetId).classList.add('active');
                });
            });

            // Handle Login Form Submission
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault(); // Prevent page reload

                    const portal = document.getElementById('portal-select').value;
                    const passcode = document.getElementById('passcode-input').value;
                    const btn = document.getElementById('unlock-btn');
                    const originalBtnText = btn.innerHTML;

                    // Ensure the Firebase module has successfully loaded
                    if (window.AuthSystem) {
                        // Change button to show loading state
                        btn.innerHTML = 'Verifying... <i class="fas fa-spinner fa-spin" style="margin-left: 8px;"></i>';
                        btn.disabled = true;

                        // Attempt to authenticate
                        const success = await window.AuthSystem.authenticate(portal, passcode);

                        // If it fails, reset the button so the user can try again
                        if (!success) {
                            btn.innerHTML = originalBtnText;
                            btn.disabled = false;
                        }
                    } else {
                        console.error('[SECURITY] AuthSystem module not loaded.');
                        if (window.AppCore) {
                            window.AppCore.notify('System is initializing. Please wait a moment and try again.', 'warning');
                        } else {
                            alert("Security module is still loading. Please try again in a moment.");
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
