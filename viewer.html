<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Databank Viewer | S.Baruah OS</title>
    
    <!-- CSS Architecture -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">
    
    <!-- FontAwesome Icons for HUD Graphics -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Viewer-Specific Layout Adjustments */
        body {
            overflow: hidden; /* Lock body scrolling, allow iframe to scroll */
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-base);
        }

        .viewer-header {
            background: var(--bg-glass-heavy);
            backdrop-filter: var(--blur-heavy);
            -webkit-backdrop-filter: var(--blur-heavy);
            border-bottom: var(--border-glass-strong);
            padding: var(--space-sm) var(--space-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: var(--z-nav);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .viewer-controls {
            display: flex;
            gap: var(--space-sm);
            align-items: center;
        }

        .content-area {
            flex: 1;
            width: 100%;
            position: relative;
            background: #ffffff; /* Default to white for documents, iframe content can override */
            display: flex;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
        }

        /* Mobile Adjustments for Viewer */
        @media (max-width: 768px) {
            .viewer-header {
                padding: var(--space-sm);
            }
            #content-title {
                font-size: 0.9rem !important;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 150px;
            }
            .btn-text-hide {
                display: none;
            }
        }
    </style>
</head>
<body>
    
    <!-- HUD Viewer Header -->
    <header class="viewer-header animate-fade-up">
        <div style="display: flex; align-items: center; gap: var(--space-md);">
            <!-- Back / Abort Button -->
            <button onclick="window.history.back()" class="btn btn-outline" style="padding: 0.5rem; border: none; box-shadow: none;">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <!-- Dynamic Metadata -->
            <div>
                <h1 id="content-title" class="heading-display" style="font-size: 1.1rem; margin: 0; color: var(--text-primary);">Loading Databank...</h1>
                <span id="content-type" class="badge badge-progress" style="font-size: 0.65rem; margin-top: 4px;">INITIALIZING</span>
            </div>
        </div>
        
        <!-- Action Controls -->
        <div class="viewer-controls">
            <!-- Fullscreen Toggle -->
            <button id="fullscreen-btn" class="btn btn-outline" style="padding: 0.5rem 0.75rem;" title="Toggle Fullscreen">
                <i class="fas fa-expand"></i>
            </button>
            
            <!-- Secure Download -->
            <a id="download-content-btn" href="#" class="btn btn-primary" style="padding: 0.5rem 1rem;" title="Download Encrypted File">
                <i class="fas fa-download"></i> <span class="btn-text-hide">Download</span>
            </a>
        </div>
    </header>

    <!-- Main Rendering Viewport -->
    <main class="content-area animate-fade-up delay-100">
        <!-- The payload is injected here via viewer.js -->
        <iframe id="content-frame" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
    </main>

    <!-- Core Scripts -->
    <script src="assets/js/core.js"></script>
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/viewer.js"></script>
    
    <!-- ES Modules (Firebase Auth for route protection) -->
    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
